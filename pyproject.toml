[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-psychology"
version = "1.0.0"
description = "Out-of-band behavioral telemetry, evaluation, and guard research plane"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0", "mcp>=1.0"]

[project.scripts]
digital-psychology-mcp = "digital_psychology.mcp_server:main"

[tool.setuptools]
packages = ["digital_psychology"]
package-dir = {digital_psychology = "lib"}

[tool.setuptools.package-data]
digital_psychology = ["schemas/*.json", "schemas/*.yaml"]
