[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-psychology"
version = "1.0.0"
description = "Out-of-band behavioral telemetry, evaluation, and guard research plane"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0", "mcp>=1.0"]

[project.optional-dependencies]
laya = ["laya==0.3.22"]
system-one = ["laya==0.3.22"]

[project.scripts]
digital-psychology-mcp = "digital_psychology.mcp_server:main"
digital-psychology-admin-mcp = "digital_psychology.transport.admin_mcp:main"
digital-psychology-control-mcp = "digital_psychology.transport.control_mcp:main"

[tool.setuptools]
packages = ["digital_psychology", "digital_psychology.runtime",
            "digital_psychology.runtime.adapters", "digital_psychology.control",
            "digital_psychology.host", "digital_psychology.transport"]
package-dir = {digital_psychology = "lib"}

[tool.setuptools.package-data]
digital_psychology = ["schemas/*.json", "schemas/*.yaml"]
